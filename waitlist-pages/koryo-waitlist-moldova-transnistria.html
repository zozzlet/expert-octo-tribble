<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moldova &amp; Transnistria Wait List | Koryo Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E8112D;
    --ink:#1F2023;
    --slate:#6B6E72;
    --cream:#FBF3EA;
    --line:#E3D9C8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#F4F4F6; --slate:#B9BDC3; --cream:#1B1611; --line:#3A3226; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Circular Standard','Karla',Helvetica,Arial,sans-serif;
  }
  .stripe{display:flex;height:7px;width:100%;}
  .stripe span{flex:1;}
  .wrap{max-width:520px;margin:0 auto;padding:40px 24px 56px;text-align:center;}
  .logo{
    font-family:'Circular Standard','Karla',Helvetica,Arial,sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:3px;
    color:var(--ink);
    margin-bottom:36px;
  }
  .logo span{color:var(--accent);}
  .badge{
    display:inline-block;
    background:var(--accent);
    color:#FFFFFF;
    font-weight:800;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    padding:6px 16px;
    border-radius:20px;
  }
  h1{
    font-size:32px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-0.5px;
    color:var(--accent);
    margin:16px 0 0;
  }
  p.teaser{
    font-size:16px;
    line-height:1.6;
    color:var(--slate);
    max-width:38ch;
    margin:14px auto 0;
  }
  .divider{
    width:44px;
    height:4px;
    background:var(--accent);
    border-radius:2px;
    margin:24px auto;
  }
  /* ===================================================== */
  /* PASTE YOUR MAILERLITE SIGN-UP FORM EMBED CODE BELOW    */
  /* ===================================================== */
  .signup-slot{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:28px 20px;
    font-size:13px;
    color:var(--slate);
  }
  /* ===================================================== */
  footer{
    margin-top:40px;
    font-size:12.5px;
    color:var(--slate);
  }
  footer .tagline{font-weight:700;margin-bottom:6px;}
</style>
</head>
<body>

  <div class="stripe">
    <span style="background:#E8112D"></span>
    <span style="background:#45B5AA"></span>
    <span style="background:#F49B1B"></span>
    <span style="background:#3D3A8C"></span>
    <span style="background:#2E9B4C"></span>
  </div>

  <div class="wrap">
    <div class="logo">KORYO <span>TOURS</span></div>

    <div class="badge">Wait list</div>
    <h1>Moldova &amp; Transnistria</h1>
    <p class="teaser">Europe's forgotten corner, hillside wine cellars and a country that, unofficially, doesn't exist.</p>
    <div class="divider"></div>

    <!-- PASTE YOUR MAILERLITE SIGN-UP FORM HERE -->
    <div class="signup-slot">Sign-up form goes here</div>

    <footer>
      <div class="tagline">Experts in Travel to Rather Unusual Destinations</div>
      Koryo Tours
    </footer>
  </div>

</body>
</html>
